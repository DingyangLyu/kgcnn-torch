[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgcnn-torch"
version = "0.1.0"
description = "Graph Neural Networks for molecules and materials science, built on PyTorch and PyG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torch_geometric>=2.4",
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.7",
    "networkx>=2.6",
    "requests",
]

[project.optional-dependencies]
molecule = ["rdkit", "openbabel-wheel", "ase"]
crystal = ["pymatgen", "pyxtal"]
vis = ["matplotlib>=3.5"]
extras = ["scikit-learn>=1.0", "pyyaml>=6.0"]
all = [
    "rdkit", "openbabel-wheel", "ase",
    "pymatgen", "pyxtal",
    "matplotlib>=3.5",
    "scikit-learn>=1.0", "pyyaml>=6.0",
]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["kgcnn_torch*"]
